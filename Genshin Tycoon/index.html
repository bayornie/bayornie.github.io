<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genshin Tycoon 3D</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-wrapper">
        <div class="currency-bar">
            <img src="https://static.wikia.nocookie.net/gensin-impact/images/8/84/Item_Mora.png" alt="Mora" class="mora-icon">
            <span id="mora-count">0</span>
        </div>

        <div id="game-canvas"></div>
        
        <div class="controls-hint">Use WASD to move. Walk over the button to buy!</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
