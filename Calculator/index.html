<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body data-bs-theme="dark">
    <div class="container">
        <div class="row">
            <div class="col">
                <div class="card mt-4 p-4">
                    <h3 class="title text-center mb-4">Calculator</h2>
                        <input class="form-control my-2" id="num1" placeholder="Enter number">
                        <input class="form-control my-2" id="num2" placeholder="Enter number">

                        <div class="row g-2 mb-2">
                            <div class="col-6">
                                <button class="btn btn-primary w-100" id="addBtn">Add</button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-primary w-100" id="subBtn">Subtract</button>
                            </div>
                        </div>

                        <div class="row g-2">
                            <div class="col-6">
                                <button class="btn btn-primary w-100" id="mulBtn">Multiply</button>
                            </div>
                            <div class="col-6">
                                <button class="btn btn-primary w-100" id="divBtn">Divide</button>
                            </div>
                        </div>

                        <button class="btn btn-primary mt-2 w-100" id="reset">Reset</button>
                        <h4 class="mt-3 text-center" id="result">Result:</h4>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const number1 = document.getElementById("num1");
        const number2 = document.getElementById("num2");
        const result = document.getElementById("result");

        function calculate(operation) {
            const n1 = parseInt(number1.value);
            const n2 = parseInt(number2.value);
            let finalResult = 0;

            if (operation === 'add') {
                finalResult = n1 + n2;
            } else if (operation === 'subtract') {
                finalResult = n1 - n2;
            } else if (operation === 'multiply') {
                finalResult = n1 * n2;
            } else if (operation === 'divide') {
                finalResult = n2 !== 0 ? n1 / n2 : "Cannot divide by zero";
            }

            result.innerHTML = "Result: " + finalResult;
        }

        function resetCalculator() {
            number1.value = "";
            number2.value = "";
            result.innerHTML = "Result:";
        }

        document.getElementById("addBtn").onclick = () => calculate('add');
        document.getElementById("subBtn").onclick = () => calculate('subtract');
        document.getElementById("mulBtn").onclick = () => calculate('multiply');
        document.getElementById("divBtn").onclick = () => calculate('divide');
        document.getElementById("reset").onclick = resetCalculator;
    </script>
</body>

</html>
