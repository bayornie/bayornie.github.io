<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teyvat Idle Clicker</title>
    <link rel="stylesheet" href="css/theme.css?v=3">
    <link rel="stylesheet" href="css/layout.css?v=3">
    <link rel="stylesheet" href="css/components.css?v=3">
    <link rel="stylesheet" href="css/special.css?v=3">
    <link rel="stylesheet" href="css/auth.css?v=3">
</head>

<body>

    <div id="top-stash">
        <div class="stash-label">Current Stash</div>
        <div class="stash-value-container">
            <span id="primogems" class="stash-count">0</span>
            <span class="stash-unit">Primogems</span>
        </div>
    </div>

    <main>
        <section id="home-panel" class="game-panel active">
            <div id="active-pets-display" class="active-pets-banner"></div>
            <div id="click-area" onclick="handleMainClick(event)">
                <div class="primogem-shape">
                    <img src="img/primogem.png" alt="Primogem" class="primogem-img" draggable="false">
                </div>
            </div>
        </section>

        <section id="upgrades-panel" class="game-panel">
            <h2 class="panel-title">Click Upgrades</h2>
            <div class="buy-multipliers">
                <button onclick="setBuyAmount(1)" class="btn-mult active">1x</button>
                <button onclick="setBuyAmount(5)" class="btn-mult">5x</button>
                <button onclick="setBuyAmount(10)" class="btn-mult">10x</button>
                <button onclick="setBuyAmount(25)" class="btn-mult">25x</button>
                <button onclick="setBuyAmount('max')" class="btn-mult">MAX</button>
            </div>
            <div id="click-upgrades" class="list-container"></div>
        </section>

        <section id="generators-panel" class="game-panel">
            <h2 class="panel-title">Generators</h2>
            <div class="buy-multipliers">
                <button onclick="setBuyAmount(1)" class="btn-mult active">1x</button>
                <button onclick="setBuyAmount(10)" class="btn-mult">10x</button>
                <button onclick="setBuyAmount(50)" class="btn-mult">50x</button>
                <button onclick="setBuyAmount('max')" class="btn-mult">MAX</button>
            </div>
            <div id="gen-upgrades" class="list-container"></div>
        </section>

        <section id="prestige-panel" class="game-panel">
            <h2 class="panel-title">Ascension</h2>
            <div class="prestige-header">
                <p>Sacrifice Primogems for permanent power.</p>
                <div class="prestige-currency">
                    <strong>Points: </strong><span id="stat-prestige" class="highlight">0</span>
                </div>
            </div>
            <button id="ascension-btn" class="auth-btn" onclick="ascend()">Ascend (1M Req.)</button>
            <div id="prestige-upgrades" class="list-container"></div>
        </section>

        <section id="shop-panel" class="game-panel">
            <h1 class="panel-title">The Shop</h1>
            <div id="shop-items" class="list-container"></div>
            <h1 class="panel-title" style="margin-top:20px">Companions</h1>
            <div id="pet-shop-list-4" class="list-container"></div>
            <div id="pet-shop-list-5" class="list-container"></div>
        </section>

        <section id="pets-panel" class="game-panel">
            <h2 class="panel-title">Party</h2>
            <div class="party-status">
                <div class="party-slots-info">Slots: <span id="party-count" class="highlight">0</span> / 4</div>
            </div>
            <div id="pets-grid" class="list-container"></div>
        </section>
    </main>

    <aside id="stats-sidebar">
        <div class="stats-header">STATISTICS</div>
        <div class="stats-container">
            <div class="stat-row"><span>Total:</span> <span id="stat-total-ever" class="value">0</span></div>
            <div class="stat-row"><span>PPS:</span> <span id="stat-pps" class="value">0.0</span></div>
            <div class="stat-row"><span>Click:</span> <span id="stat-click" class="value">1</span></div>
            <div id="active-pets-mini" class="mini-pet-list"></div>
        </div>
        <div class="sidebar-footer">
            <div id="user-controls" style="display: none;">
                <button class="account-btn" onclick="openProfile()">Profile</button>
                <button class="logout-link" onclick="handleLogout()">Logout</button>
            </div>
            <button id="login-nav-btn" class="account-btn" onclick="openAuth()">Login</button>
        </div>
    </aside>

    <nav>
        <div class="nav-item active" onclick="showPanel('home')">🏠</div>
        <div class="nav-item" onclick="showPanel('upgrades')">⚔️</div>
        <div class="nav-item" onclick="showPanel('generators')">⚙️</div>
        <div class="nav-item" onclick="showPanel('prestige')">✨</div>
        <div class="nav-item" onclick="showPanel('shop')">🛒</div>
        <div class="nav-item" onclick="showPanel('pets')">👥</div>
    </nav>

    <div id="auth-overlay" class="auth-overlay" style="display: none;">
        <div class="auth-card">
            <h2 id="auth-title">Welcome</h2>
            <div id="login-form">
                <input type="email" id="login-email" placeholder="Email">
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Password">
                    <span class="password-toggle" onclick="togglePasswordVisibility('password')">👁️</span>
                </div>
                <button class="auth-btn" onclick="handleAuth('login')">Login</button>
                <p onclick="toggleAuth()" class="toggle-link">New? Register</p>
            </div>
            <div id="register-form" style="display:none;">
                <input type="email" id="reg-email" placeholder="Email">
                <input type="text" id="reg-username" placeholder="Username">
                <div class="password-wrapper">
                    <input type="password" id="reg-password" placeholder="Password">
                </div>
                <button class="auth-btn" onclick="handleAuth('register')">Register</button>
                <p onclick="toggleAuth()" class="toggle-link">Back to Login</p>
            </div>
        </div>
    </div>

    <div id="profile-overlay" class="auth-overlay" style="display: none;">...</div>
    <div id="offline-modal" class="modal-overlay" style="display:none;">...</div>
    <div id="game-toast" class="toast-notification"></div>
    <div id="touch-container"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <script src="javascript/config.js?v=3"></script>
    <script src="javascript/mechanics.js?v=3"></script>
    <script src="javascript/core.js?v=3"></script>
    <script src="javascript/auth.js?v=3"></script>
</body>

</html>
