<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genshin 2D | Sorcerer Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        #master-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #3a3f4b;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .game-ui {
            display: none;
            width: 100%;
            height: 100%;
            position: absolute;
            left: 0;
            bottom: 0;
            pointer-events: none;
        }

        /* Mobile Specific Adjustment */
        @media (max-width: 768px) {
            .game-ui {
                bottom: 20px;
                /* Pulls it up only on mobile devices */
            }
        }

        .game-ui * {
            pointer-events: auto;
        }

        .char-info {
            position: absolute;
            bottom: 25px;
            /* Keeps it pinned to the very bottom */
            left: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
            /* Space between portrait and Level Badge */
        }

        .portrait {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(25, 28, 35, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .portrait img {
            width: 55%;
            filter: drop-shadow(0 0 5px #bc8cf2);
            position: relative;
            z-index: 2;
        }

        /* Skill Container: Visible on Desktop by default */
        .skills-container {
            position: absolute;
            bottom: 30px;
            right: 40px;
            display: flex;
            gap: 20px;
        }

        .skill-slot {
            width: 55px;
            height: 55px;
            background: rgba(25, 28, 35, 0.6);
            border: 1.5px solid rgba(188, 140, 242, 0.4);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #f3e5ab;
        }

        .skill-key {
            color: white;
            font-size: 12px;
            opacity: 0.8;
        }

        .level-badge {
            background: rgba(25, 28, 35, 0.8);
            padding: 4px 12px;
            border-radius: 12px;
            border: 1px solid rgba(188, 140, 242, 0.4);
            backdrop-filter: blur(5px);
        }

        #level-text {
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: bold;
            color: #f3e5ab;
            text-shadow: 1px 1px 2px black;
        }

        .health-container {
            width: 160px;
            height: 10px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            margin-top: 5px;
        }

        .health-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #bc8cf2, #ffffff);
            box-shadow: 0 0 10px #bc8cf2;
            transition: width 0.3s ease-out;
        }

        /* Mobile Logic: Hides skill buttons and scales wrapper */
        @media (max-width: 850px) {
            #game-wrapper {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
            }

            /* Hides the HTML skills container on mobile */
            .skills-container {
                display: none !important;
            }

            .char-info {
                bottom: 20px;
                left: 20px;
            }
        }
    </style>
</head>

<body>
    <div id="master-container">
        <div id="game-wrapper">
            <div id="game-container"></div>

            <div class="hud-layer">
                <div class="game-ui">
                    <div class="char-info">
                        <div class="portrait">
                            <svg width="70" height="70"
                                style="position: absolute; transform: rotate(-90deg); top: 0; left: 0;">
                                <circle cx="35" cy="35" r="33" stroke="rgba(255, 255, 255, 0.1)" stroke-width="4"
                                    fill="transparent" />
                                <circle id="xp-circle" cx="35" cy="35" r="33" stroke="#bc8cf2" stroke-width="4"
                                    fill="transparent" stroke-dasharray="207" stroke-dashoffset="207"
                                    style="transition: stroke-dashoffset 0.4s ease-out; stroke-linecap: round;" />
                            </svg>
                            <img src="https://cdn-icons-png.flaticon.com/512/11543/11543781.png" alt="portrait">
                        </div>

                        <div class="level-badge">
                            <span id="level-text" class="fw-bold">LVL 1</span>
                        </div>

                        <div>
                            <div class="health-container">
                                <div id="burst-bar" class="health-bar"></div>
                            </div>
                        </div>
                    </div>

                    <div class="skills-container desktop-only-ui">
                        <div class="skill-slot"><span>DASH</span><span class="skill-key">E</span></div>
                        <div class="skill-slot" style="border-color: #00ffff;">
                            <span>BURST</span><span class="skill-key">Q</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js?v=8"></script>
    <script src="ui.js?v=8"></script>
    <script src="system.js?v=8"></script>
    <script src="game.js?v=8"></script>
</body>

</html>
