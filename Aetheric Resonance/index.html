<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Genshin 2D | Sorcerer Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser-arcade-physics.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0b0e14;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', sans-serif;
            color: white;
        }

        #master-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        #game-wrapper {
            position: relative;
            width: 800px;
            height: 600px;
            border: 2px solid #3a3f4b;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            height: 100%;
        }

        /* The Overlay HUD layer */
        .hud-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking "through" the HUD to the game */
            z-index: 10;
        }

        .game-ui {
            display: none; /* Toggled via setUIVisible() in ui.js */
            width: 100%;
            height: 100%;
            position: relative;
        }

        .char-info {
            position: absolute;
            bottom: 25px;
            left: 30px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .portrait {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(25, 28, 35, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .portrait img {
            width: 55%;
            filter: drop-shadow(0 0 5px #bc8cf2);
            position: relative;
            z-index: 2;
        }

        .health-container {
            width: 200px;
            height: 12px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .health-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #bc8cf2, #ffffff);
            box-shadow: 0 0 10px #bc8cf2;
            transition: width 0.3s ease-out;
        }

        .skills-container {
            position: absolute;
            bottom: 30px;
            right: 40px;
            display: flex;
            gap: 20px;
        }

        .skill-slot {
            width: 55px;
            height: 55px;
            background: rgba(25, 28, 35, 0.6);
            border: 1.5px solid rgba(188, 140, 242, 0.4);
            border-radius: 50%;
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #f3e5ab;
        }

        .skill-key {
            color: white;
            font-size: 12px;
            opacity: 0.8;
        }

        /* Mobile specific adjustments */
        @media (max-width: 850px) {
            #game-wrapper {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
            }
            .skill-key { display: none; }
        }
    </style>
</head>

<body>
    <div id="master-container">
        <div id="game-wrapper">
            <div id="game-container"></div>
            
            <div class="hud-layer">
                <div class="game-ui">
                    <div class="char-info">
                        <div class="portrait">
                            <svg width="75" height="75" style="position: absolute; transform: rotate(-90deg); top: 0; left: 0;">
                                <circle cx="37.5" cy="37.5" r="35" stroke="rgba(255, 255, 255, 0.1)" stroke-width="5" fill="transparent" />
                                <circle id="xp-circle" cx="37.5" cy="37.5" r="35" stroke="#bc8cf2" stroke-width="5"
                                    fill="transparent" stroke-dasharray="220" stroke-dashoffset="220"
                                    style="transition: stroke-dashoffset 0.4s ease-out; stroke-linecap: round;" />
                            </svg>
                            <img src="https://cdn-icons-png.flaticon.com/512/11543/11543781.png" alt="portrait">
                        </div>
                        <div>
                            <div id="level-text" class="fw-bold" style="font-size: 14px; margin-bottom: 4px; text-shadow: 1px 1px 2px black;">LVL 1</div>
                            <div class="health-container">
                                <div id="burst-bar" class="health-bar"></div>
                            </div>
                        </div>
                    </div>

                    <div class="skills-container">
                        <div class="skill-slot"><span>DASH</span><span class="skill-key">E</span></div>
                        <div class="skill-slot" style="border-color: #00ffff; box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);">
                            <span>BURST</span><span class="skill-key">Q</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="ui.js"></script>
    <script src="system.js"></script>
    <script src="game.js"></script>
</body>

</html>
